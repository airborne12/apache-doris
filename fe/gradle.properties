# Gradle build optimization settings
# ===================================

# Enable the Gradle Daemon for faster builds
org.gradle.daemon=true

# Enable parallel project execution
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# Configure on demand - only configure required projects
org.gradle.configureondemand=true

# JVM settings for the Gradle daemon
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# Enable file system watching for better incremental builds
org.gradle.vfs.watch=true

# Kotlin DSL improvements
org.gradle.kotlin.dsl.allWarningsAsErrors=false

# Enable dependency verification caching
org.gradle.dependency.verification.console=verbose
